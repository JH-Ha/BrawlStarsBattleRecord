name: Test SSH Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Test connection
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 \
            ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} '
            echo "=== SSH OK ==="
            whoami
            ls -la ~/apps 2>/dev/null || echo "~/apps 디렉토리 없음 (deploy/README.md 1번 참고)"
            sudo -n systemctl is-active brawlstars-api 2>/dev/null || echo "brawlstars-api 서비스 미등록 또는 sudoers 미설정"
            sudo -n systemctl is-active brawlstars-web 2>/dev/null || echo "brawlstars-web 서비스 미등록 또는 sudoers 미설정"
          '
