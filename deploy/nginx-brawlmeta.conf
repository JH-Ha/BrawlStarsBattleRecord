# /etc/nginx/sites-available/brawlmeta.conf
# 이 파일이 최종본이며 deploy-nginx.yml 이 master push 시 EC2로 배포한다.
# 443 블록이 Let's Encrypt 인증서를 참조하므로, 인증서 발급 전에는 적용 불가
# — 최초 셋업 순서는 deploy/README.md 7번 참고

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name brawlmeta.com www.brawlmeta.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brawlmeta.com www.brawlmeta.com;

    ssl_certificate     /etc/letsencrypt/live/brawlmeta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brawlmeta.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
